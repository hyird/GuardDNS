plugins:
  - tag: forward_remote
    type: forward
    args:
      concurrent: 2
      upstreams:
        - tag: cloudflare
          addr: https://cloudflare-dns.com/dns-query
          dial_addr: 1.1.1.1:443
        - tag: google
          addr: https://dns.google/dns-query
          dial_addr: 8.8.8.8:443

  - tag: secure_cache
    type: cache
    args:
      size: 8192
      lazy_cache_ttl: 0

  - tag: secure_real_path
    type: sequence
    args:
      - exec: $secure_cache
      - exec: $forward_remote

  - tag: foreign_path
    type: sequence
    args:
      - exec: goto secure_real_path
