plugins:
  - tag: forward_remote
    type: forward
    args:
      concurrent: 2
      upstreams:
        # Resolve the provider hostname through a reachable bootstrap server,
        # then authenticate it with TLS. This follows provider IP changes and
        # avoids depending on direct routes to fixed overseas DoH addresses.
        - tag: alidns
          addr: https://dns.alidns.com/dns-query
          bootstrap: 223.5.5.5
          bootstrap_version: 4
        - tag: dnspod
          addr: https://doh.pub/dns-query
          bootstrap: 119.29.29.29
          bootstrap_version: 4

  - tag: secure_cache
    type: cache
    args:
      size: 8192
      lazy_cache_ttl: 0

  - tag: secure_real_path
    type: sequence
    args:
      - exec: $secure_cache
      - exec: $forward_remote

  - tag: foreign_path
    type: sequence
    args:
      - exec: goto secure_real_path
